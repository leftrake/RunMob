services:
  - type: web
    name: runmob-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @runmob/api run db:generate && pnpm --filter @runmob/api run db:push
    startCommand: pnpm --filter @runmob/api start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runmob-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: runmob-db
    databaseName: runmob
    user: runmob
